<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <!-- Saloon swinging doors — crimson trim -->
  <defs>
    <linearGradient id="trim" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe8e0"/>
      <stop offset=".28" stop-color="#e8a898"/>
      <stop offset=".55" stop-color="#c05040"/>
      <stop offset=".82" stop-color="#882820"/>
      <stop offset="1" stop-color="#481410"/>
    </linearGradient>
    <linearGradient id="post" x1="18" y1="16" x2="36" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6a4630"/>
      <stop offset=".45" stop-color="#3c2416"/>
      <stop offset="1" stop-color="#1a100c"/>
    </linearGradient>
    <linearGradient id="lintel" x1="16" y1="10" x2="112" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a87848"/>
      <stop offset=".4" stop-color="#6b4324"/>
      <stop offset="1" stop-color="#2a180e"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e4c48a"/>
      <stop offset=".35" stop-color="#c4924e"/>
      <stop offset=".7" stop-color="#8a5a2c"/>
      <stop offset="1" stop-color="#4e3018"/>
    </linearGradient>
    <radialGradient id="lamp" cx="64" cy="78" r="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb090"/>
      <stop offset=".4" stop-color="#a03028" stop-opacity=".75"/>
      <stop offset="1" stop-color="#280c08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inside" x1="64" y1="36" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a0c0a"/>
      <stop offset=".55" stop-color="#3a1612"/>
      <stop offset="1" stop-color="#120806"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>

  <ellipse cx="64" cy="80" rx="22" ry="26" fill="url(#lamp)"/>

  <rect x="14" y="12" width="100" height="12" rx="1.5" fill="url(#lintel)" stroke="url(#trim)" stroke-width="1.6"/>
  <rect x="18" y="14" width="92" height="3" fill="#ffe8e0" opacity=".22"/>
  <rect x="16" y="108" width="96" height="8" rx="1" fill="#2a1c12" stroke="url(#trim)" stroke-width="1.2"/>
  <rect x="14" y="20" width="12" height="92" rx="1" fill="url(#post)" stroke="url(#trim)" stroke-width="1.3"/>
  <rect x="102" y="20" width="12" height="92" rx="1" fill="url(#post)" stroke="url(#trim)" stroke-width="1.3"/>

  <g filter="url(#soft)" transform="rotate(-13 30 78)">
    <path d="M30 50 C30 44 38 42 48 44 L60 50 L62 56 L62 98 L30 98 Z" fill="url(#plank)" stroke="#2a160c" stroke-width="1.2"/>
    <path d="M30 50 C38 46 50 46 60 52" fill="none" stroke="url(#trim)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M38 56 V96 M46 54 V96 M54 56 V96" stroke="#3a2010" stroke-width="1.15" opacity=".8"/>
    <path d="M32 72 H60" stroke="url(#trim)" stroke-width="3"/>
    <rect x="28" y="58" width="6" height="10" rx="1" fill="#301410" stroke="url(#trim)" stroke-width="1"/>
    <rect x="28" y="82" width="6" height="10" rx="1" fill="#301410" stroke="url(#trim)" stroke-width="1"/>
    <circle cx="31" cy="63" r="1.3" fill="#1a0808" stroke="#ffe8e0" stroke-width=".5"/>
    <circle cx="31" cy="87" r="1.3" fill="#1a0808" stroke="#ffe8e0" stroke-width=".5"/>
  </g>
  <g filter="url(#soft)" transform="rotate(13 98 78)">
    <path d="M98 50 C98 44 90 42 80 44 L68 50 L66 56 L66 98 L98 98 Z" fill="url(#plank)" stroke="#2a160c" stroke-width="1.2"/>
    <path d="M98 50 C90 46 78 46 68 52" fill="none" stroke="url(#trim)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M90 56 V96 M82 54 V96 M74 56 V96" stroke="#3a2010" stroke-width="1.15" opacity=".8"/>
    <path d="M68 72 H96" stroke="url(#trim)" stroke-width="3"/>
    <rect x="94" y="58" width="6" height="10" rx="1" fill="#301410" stroke="url(#trim)" stroke-width="1"/>
    <rect x="94" y="82" width="6" height="10" rx="1" fill="#301410" stroke="url(#trim)" stroke-width="1"/>
    <circle cx="97" cy="63" r="1.3" fill="#1a0808" stroke="#ffe8e0" stroke-width=".5"/>
    <circle cx="97" cy="87" r="1.3" fill="#1a0808" stroke="#ffe8e0" stroke-width=".5"/>
  </g>
</svg>
